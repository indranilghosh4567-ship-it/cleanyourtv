name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: chmod +x launcher/gradlew

      - name: Build Launcher APK
        working-directory: launcher
        run: ./gradlew assemble --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Launcher-APK
          path: launcher/app/build/outputs/apk/**/*.apk
          
